name: Paparazzi snapshot verification

# Deterministic, JVM-only snapshot regression gate (design §6, T5).
# Paparazzi renders on the host JVM — NO emulator/device is needed, so this job
# is fast and cheap. It fails the build on any pixel delta vs the committed
# golden images under demo-app/src/test/snapshots/images/.
#
# MANDATORY visual-review gate: a green `verifyPaparazziDebug` only proves
# "pixels match the goldens". When it FAILS, a human/agent MUST open the
# uploaded golden/actual/delta PNGs and confirm the *new* rendering is correct
# before re-recording goldens (`./gradlew recordPaparazziDebug`) and committing
# them. Never blindly re-record to make CI green.

on:
  pull_request:
    paths:
      - 'demo-app/**'
      - 'toolkit/**'
      - '.github/workflows/paparazzi.yml'
  push:
    branches: [ main ]

jobs:
  verify-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17: matches the repo toolchain and the stable Paparazzi 1.3.5
      # (API-34 layoutlib). If/when the demo moves to compileSdk 36 + Paparazzi
      # 2.x, bump this to java-version '21'.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Paparazzi snapshots
        working-directory: demo-app
        run: ./gradlew verifyPaparazziDebug --stacktrace

      # On failure, publish the deltas so the mandatory visual-review gate can be
      # performed from the CI artifacts (golden vs actual vs delta).
      - name: Upload snapshot deltas on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-deltas
          path: |
            demo-app/build/paparazzi/**
            demo-app/build/reports/paparazzi/**
          if-no-files-found: ignore
